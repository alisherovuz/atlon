<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish — Atlon Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#10243B;--glaze:#1B7F9E;--glaze-deep:#125F78;--saffron:#E8A33D;--line:#D9E0E8}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 22% 18%, rgba(27,127,158,.42), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(232,163,61,.20), transparent 46%);
    font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);
  }
  .box{width:100%;max-width:352px;background:#fff;border-radius:16px;padding:30px;
       box-shadow:0 20px 60px rgba(0,0,0,.32)}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:27px;
         letter-spacing:-.025em;margin:0}
  .brand span{color:var(--saffron)}
  .sub{color:#4A5F78;font-size:14px;margin:5px 0 22px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit}
  input:focus{outline:2px solid var(--glaze);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:9px;
         background:var(--glaze);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--glaze-deep)}
  .alert{background:#F9E2E0;color:#8E2E27;padding:10px 13px;border-radius:9px;
         font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1 class="brand">ATLON<span>.</span></h1>
    <p class="sub">Boshqaruv paneliga kirish</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label for="password">Parol</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Kirish</button>
  </form>
</body>
</html>
